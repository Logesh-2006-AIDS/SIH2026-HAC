services:
  - type: web
    name: sih2026-crime-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sih2026-crime-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["https://sih-2926.vercel.app","https://sih-2926-dharshan1120s-projects.vercel.app"]'
      - key: MEMGRAPH_URI
        sync: false
      - key: MEMGRAPH_USER
        sync: false
      - key: MEMGRAPH_PASSWORD
        sync: false

databases:
  - name: sih2026-crime-db
    region: singapore
    plan: free
    databaseName: sih2026
    user: sih2026
